[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_mini_i_spy"
version = "0.2.0"
description = "A privacy-preserving, camera-opt-in bilingual I Spy game for Reachy Mini"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tim Verhoogt and contributors" }]
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "onnxruntime>=1.19,<2",
    "Pillow>=10",
    "pydantic>=2.8",
    "reachy-mini>=1.9,<2",
    "sherpa-onnx==1.13.4",
    "scipy>=1.15,<2",
]
keywords = ["reachy-mini-app", "robotics", "computer-vision", "kids-mode", "i-spy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

[project.urls]
Homepage = "https://github.com/Timverhoogt/reachy-mini-i-spy"
Repository = "https://github.com/Timverhoogt/reachy-mini-i-spy"
Issues = "https://github.com/Timverhoogt/reachy-mini-i-spy/issues"
"Reachy app catalog source" = "https://huggingface.co/spaces/Timbo89/reachy_mini_i_spy"
"Project origin: Reachy Mini Hermes" = "https://github.com/Timverhoogt/reachy-mini-hermes"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.9"]

[project.entry-points."reachy_mini_apps"]
reachy_mini_i_spy = "reachy_mini_i_spy.main:ReachyMiniISpy"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["reachy_mini_i_spy*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
reachy_mini_i_spy = ["static/*.html", "static/*.css", "static/*.js", "models/*.onnx", "models/*.md", "models/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]